
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Simple Note Taking App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts, one note at a time.</p>
    </header>

    <main>
        <section class="note-section">
            <h2>Add a Note</h2>

            <form id="note-form">
                <label for="note-input">Your Note:</label>
                <input
                    type="text"
                    id="note-input"
                    placeholder="Write your note here..."
                >

                <label for="note-category">Category:</label>
                <select id="note-category">
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                </select>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>

        <section class="notes-section">
            <h2>Your Notes</h2>

            <label for="search-input">Search Notes:</label>
            <input
                type="search"
                id="search-input"
                placeholder="Search your notes..."
            >

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. All rights reserved.</p>
    </footer>

</body>
</html>
